name: Coleta PSI

on:
  # O "schedule" do GitHub foi retirado em 19/11: na 1ª noite ele atrasou os
  # disparos de pico em 5 a 7 h e não executou os de 03h07 e 05h07 (docs/anomalias.md).
  # Os horários da coleta agora vêm de um agendador externo (cron-job.org), que
  # chama a API do workflow_dispatch com agendado=true no horário exato (BRT):
  # 20h07, 22h07, 03h07 e 05h07. Ver docs/agendador.md.
  workflow_dispatch:
    inputs:
      agendado:
        description: "true só para o agendador externo; disparo manual de teste deixa false"
        type: boolean
        default: false
      cron:
        description: "Horário nominal em cron UTC (ex.: 7 23 * * *), enviado pelo agendador"
        type: string
        default: ""

permissions:
  contents: write
  # Para abrir a issue de alerta quando a coleta agendada falha.
  issues: write

# Uma execução por vez: a seguinte espera a atual terminar.
concurrency:
  group: coleta-psi
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Definir destino dos dados
        env:
          AGENDADO: ${{ inputs.agendado }}
          CRON_NOMINAL: ${{ inputs.cron }}
        run: |
          if [ "$AGENDADO" = "true" ]; then
            # Só os 4 horários do desenho entram na coleta principal.
            case "$CRON_NOMINAL" in
              "7 23 * * *"|"7 1 * * *"|"7 6 * * *"|"7 8 * * *") ;;
              *) echo "cron inválido para coleta agendada: '$CRON_NOMINAL'" >&2; exit 1 ;;
            esac
            echo "GATILHO=agendador" >> "$GITHUB_ENV"
            echo "DESTINO=data/raw" >> "$GITHUB_ENV"
            echo "ESTADO=data/estado_reservas.json" >> "$GITHUB_ENV"
          else
            echo "GATILHO=workflow_dispatch" >> "$GITHUB_ENV"
            # Disparos manuais não entram na análise nem alteram as reservas da coleta.
            echo "DESTINO=data/raw/testes" >> "$GITHUB_ENV"
            echo "ESTADO=data/raw/testes/estado_reservas.json" >> "$GITHUB_ENV"
          fi

      - name: Coletar
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          CRON: ${{ inputs.cron }}
        run: python scripts/collect.py --urls config/urls.csv --out "$DESTINO" --json out/json --estado "$ESTADO"

      - name: Publicar JSONs brutos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/json/
          retention-days: 90
          if-no-files-found: warn

      - name: Versionar os CSVs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if [ -f data/estado_reservas.json ]; then git add data/estado_reservas.json; fi
          if git diff --cached --quiet; then
            echo "Nada novo para versionar."
            exit 0
          fi
          git commit -m "Registra coleta $GATILHO ${{ github.run_id }}" -m "Refs #10"
          for tentativa in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((tentativa * 10))
          done
          echo "Não foi possível enviar os dados." >&2
          exit 1

      # Apoio ao #T-0: uma issue nova notifica quem acompanha o repositório (Watch).
      # Não cobre execução que o GitHub nem chega a iniciar; isso é visto na checagem diária.
      - name: Avisar a equipe se a coleta falhar
        if: failure() && inputs.agendado
        env:
          GH_TOKEN: ${{ github.token }}
          CRON: ${{ inputs.cron }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Falha na coleta agendada (cron ${CRON}, $(date -u +%Y-%m-%dT%H:%MZ))" \
            --body "A execução ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} falhou.

          Quem estiver na vigilância do dia: abrir o log, avisar o responsável pela coleta (papel B) e registrar em docs/anomalias.md.

          Refs #10"
